<!doctype html>
<html><head><meta charset="utf-8"><title>Viewport QA harness</title>
<style>body{margin:0;background:#111;color:#eee;font:12px/1.4 monospace}#out{white-space:pre-wrap;padding:8px;font-size:10px}iframe{border:0;background:#fff;display:block}</style></head>
<body>
<div id="out">ready</div>
<iframe id="f" width="390" height="844" style="position:fixed;left:-5000px;top:0"></iframe>
<script>
const f=document.getElementById('f'),out=document.getElementById('out');
window.load=(src,w,h,mode)=>new Promise(r=>{try{localStorage.setItem('waw-mode',mode||'dark');sessionStorage.setItem('waw-pl','1');sessionStorage.setItem('waw-qa','1')}catch(e){};f.width=w;f.height=h||900;f.onload=()=>setTimeout(r,2500);f.src='../'+src;});
window.probe=()=>{const d=f.contentDocument,w=f.contentWindow;const vw=d.documentElement.clientWidth;const bad=[];d.querySelectorAll('body *').forEach(el=>{const r=el.getBoundingClientRect();if(r.width>0&&(r.right>vw+1||r.left<-1)){let p=el.parentElement,clipped=false;while(p&&p!==d.body){const cs=w.getComputedStyle(p);if(/(hidden|clip|auto|scroll)/.test(cs.overflowX)){const pr=p.getBoundingClientRect();if(pr.right<=vw+1&&pr.left>=-1){clipped=true;break}}p=p.parentElement}if(!clipped)bad.push((el.tagName+'.'+(el.getAttribute('data-screen-label')||'')+' '+(el.textContent||'').trim().slice(0,30)).replace(/\s+/g,' ')+' ['+Math.round(r.left)+','+Math.round(r.right)+']')}});
const small=[];d.querySelectorAll('a[href],button,input,textarea').forEach(el=>{const r=el.getBoundingClientRect();if(r.width>0&&r.height>0&&(r.height<43.5)&&w.getComputedStyle(el).display!=='inline')small.push((el.textContent||el.name||'').trim().slice(0,24)+' '+Math.round(r.width)+'x'+Math.round(r.height))});
const P=s=>{const m=s.match(/[\d.]+/g);return m?m.map(Number):[0,0,0,0]};const L=c=>{const a=c.slice(0,3).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};const bgOf=el=>{while(el){const c=P(w.getComputedStyle(el).backgroundColor);if((c[3]===undefined||c[3]>.9)&&w.getComputedStyle(el).backgroundColor!=='rgba(0, 0, 0, 0)')return c;el=el.parentElement}return [255,255,255]};const lowC=[];d.querySelectorAll('body *').forEach(el=>{if(![...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))return;const cs=w.getComputedStyle(el);if(cs.visibility==='hidden'||+cs.opacity<.5)return;const r=el.getBoundingClientRect();if(!r.width||!r.height)return;if(el.closest('[aria-hidden=true]'))return;const fg=P(cs.color);if(fg[3]!==undefined&&fg[3]<.5)return;const bg=bgOf(el);const a=L(fg),b=L(bg);const ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);const big=parseFloat(cs.fontSize)>=24;if(ratio<(big?3:4.5))lowC.push(el.textContent.trim().slice(0,22)+' '+ratio.toFixed(2)+' '+cs.color)});
return {lowC:[...new Set(lowC)].slice(0,8),lowCount:lowC.length,vw,scrollW:d.documentElement.scrollWidth,overflow:bad.slice(0,15),overflowCount:bad.length,smallTargets:small.slice(0,15),smallCount:small.length,h1:d.querySelectorAll('h1').length,title:d.title,desc:(d.querySelector('meta[name=description]')||{}).content||null};};
window.R=[];window.run=async(pages,widths)=>{for(const p of pages)for(const w of widths){await load(p,w,900,window.MODE||'dark');const o=probe();o.errs=(f.contentWindow.__wawErrs||[]).slice(0,6);R.push(p+' @'+w+' scrollW='+o.scrollW+'/'+o.vw+' overflow='+o.overflowCount+' '+JSON.stringify(o.overflow.slice(0,4))+' small='+o.smallCount+' '+JSON.stringify(o.smallTargets.slice(0,6))+' h1='+o.h1+' lowC='+o.lowCount+' '+JSON.stringify(o.lowC)+' desc='+(o.desc?'yes':'NO')+' title='+o.title+(o.errs.length?' ERRS='+JSON.stringify([...new Set(o.errs.map(e=>e.replace(/https?:\/\/[^\s)]+\//g,'').slice(0,110)))]):''));out.textContent=R.join('\n\n')}R.push('DONE');out.textContent=R.join('\n\n')};
window.show=o=>{out.textContent=JSON.stringify(o,null,1)};
</script></body></html>
